services:
  wows-crypto-bot:
    build: .
    restart: unless-stopped
    container_name: wows_crypto_bot
    volumes:
      - ./user_data:/freqtrade/user_data
    environment:
      - WOWS_BASE_URL=${WOWS_BASE_URL:-http://host.docker.internal:3000}
      - BOT_API_KEY=${BOT_API_KEY}
      - BOT_ID=${BOT_ID:-freqtrade-alpha-1}
      - SQLITE_DB_PATH=/freqtrade/user_data/outbox.db
      - PYTHONUNBUFFERED=1
    command: >
      trade
      --config /freqtrade/user_data/config-tactical-v3.json
      --strategy WowsStrategyV3
